[profile.default]
src = "contracts"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./artifacts" }, { access = "read", path = "../artifacts" }]

[fuzz]
runs = 256
