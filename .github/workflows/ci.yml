name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ANVIL_BINARY: anvil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - name: Install pinned Anvil for retained Relayr payment bytecode checks
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.0
          cache: false
      - name: Prepare pinned compiler for retained Relayr executable-equivalence check
        run: forge build --use 0.8.26 --evm-version cancun --via-ir --optimize --optimizer-runs 200 --contracts src/rest/sponsorship/stack/relayr --out "$RUNNER_TEMP/center-relayr-out" --cache-path "$RUNNER_TEMP/center-relayr-cache"
      - run: npm ci --ignore-scripts
      - run: npm --prefix mcp ci --ignore-scripts
      - name: Install pinned Chromium for documentation browser checks
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check protocol APIs, storage, sponsorship and MCP
        run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix mcp audit --omit=dev --audit-level=high
      - name: Build Center and standalone MCP images
        run: |
          docker build -t jbcenter:${{ github.sha }} .
          docker build -t juicebox-mcp:${{ github.sha }} mcp
